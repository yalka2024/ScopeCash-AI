{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scopecash-ai-server-pdb
spec:
  minAvailable: {{ .Values.podDisruptionBudget.server.minAvailable }}
  selector:
    matchLabels: { app: scopecash-ai, component: server }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scopecash-ai-dashboard-pdb
spec:
  minAvailable: {{ .Values.podDisruptionBudget.dashboard.minAvailable }}
  selector:
    matchLabels: { app: scopecash-ai, component: dashboard }
{{- if .Values.worker.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scopecash-ai-worker-pdb
spec:
  minAvailable: {{ .Values.podDisruptionBudget.worker.minAvailable }}
  selector:
    matchLabels: { app: scopecash-ai, component: worker }
{{- end }}
{{- end }}

