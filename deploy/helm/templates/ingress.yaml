{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scopecash-ai
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: ["{{ .Values.ingress.host }}"]
      secretName: scopecash-ai-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: scopecash-ai-server
                port: { number: 80 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scopecash-ai-dashboard
                port: { number: 80 }
{{- end }}

