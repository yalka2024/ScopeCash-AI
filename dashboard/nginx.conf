server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Liveness for k8s/compose
  location = /healthz { return 200 "ok"; add_header Content-Type text/plain; }

  # Long-cache hashed assets. Path is /assets/, not CRA's /static/ — this
  # project moved to Vite (vite.config.js emits build/assets/) and the rule was
  # never updated, so every hashed bundle fell through to the SPA location
  # below and was served with no immutable cache header, forcing a revalidation
  # on each load. Same CRA-to-Vite naming drift as the rest of this sweep.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
  }
}

