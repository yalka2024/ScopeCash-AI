name: ci

on:
  push: { branches: [master] }
  pull_request: { branches: [master] }

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scopecash-ai
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-must-be-at-least-32-characters-long-ok
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20.11', cache: 'npm', cache-dependency-path: server/package-lock.json }
      - name: Install
        working-directory: server
        run: npm ci --no-audit --no-fund
      # Validates the Postgres migration set applies cleanly against a real
      # Postgres on every PR — no `|| true`: a migration that fails here would
      # have failed identically in production. This previously pointed
      # DATABASE_URL at Postgres while `prisma generate`/`migrate deploy` ran
      # against the default SQLite schema — a provider mismatch that `|| true`
      # was silently swallowing rather than fixing.
      - name: Validate Postgres migrations apply cleanly
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scopecash-ai
        run: |
          node prisma/sync-postgres-schema.js
          npx prisma migrate deploy --config prisma.postgres.config.ts
      # Real Postgres + RLS application tests — the class of test SQLite
      # structurally cannot run (no RLS at all). This is exactly how the
      # billing.js/board-reports.js bugs (a route querying an RLS-protected
      # table with no tenant context, silently seeing zero rows instead of
      # an error) went undetected: every prior test ran against SQLite,
      # where that code path just worked, for the wrong reason. Runs as a
      # dedicated non-superuser role — Postgres superusers bypass RLS
      # regardless of policy, which would make every test below pass for
      # the wrong reason too.
      - name: Set up non-superuser Postgres role for RLS tests
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scopecash-ai
        run: node prisma/ci-postgres-test-role.js scopecash_rls_test ci-rls-test-role-${{ github.run_id }}
      - name: Apply RLS policies (Postgres)
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scopecash-ai
        run: node prisma/apply-rls.js
      - name: Generate Postgres-flavored Prisma client
        working-directory: server
        run: npx prisma generate --config prisma.postgres.config.ts
      - name: Postgres RLS regression tests
        working-directory: server
        env:
          DATABASE_URL: postgresql://scopecash_rls_test:ci-rls-test-role-${{ github.run_id }}@localhost:5432/scopecash-ai
        run: npm run test:postgres-rls
      - name: Prisma generate (SQLite — used by the main test suite)
        working-directory: server
        run: npx prisma generate
      - name: Prisma migrate (SQLite test DB)
        working-directory: server
        run: npx prisma migrate deploy
      - name: Tests
        working-directory: server
        run: npm test
      # Dependency vulnerability report. NOT a blocking gate here: the
      # current production dependency tree has 18 high-severity transitive
      # advisories, ALL from @google-cloud/storage's own pinned uuid/
      # teeny-request/retry-request versions (verified: 7.21.0 is already
      # the latest published release and still carries them — `npm audit
      # fix --force` has nothing safe to apply, only a downgrade). Nothing
      # in this app's own code is unfixable; this is Google's package
      # waiting on an upstream release. Blocking CI on an issue this repo
      # cannot currently resolve would just train everyone to ignore red
      # builds. Re-run `npm audit --omit=dev --audit-level=high` after any
      # @google-cloud/storage bump to check whether it's finally safe to
      # make this blocking (`continue-on-error: false` — see TODO.md).
      - name: Dependency vulnerability scan (report only — see comment above)
        working-directory: server
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      # Release eval gate. Always runs — without GCP secrets configured (e.g.
      # every fork PR; GitHub Actions never exposes repo secrets to those) it
      # falls back to the deterministic 4-case mock "smoke" suite, which only
      # validates the harness itself, not model behavior. With
      # GCP_SERVICE_ACCOUNT_KEY/GCP_PROJECT_ID/VERTEX_GEMINI_MODEL configured
      # as repo secrets (pushes to main, and PRs from branches within this
      # repo), it runs the real thing: toxicity, prompt_injection,
      # robustness, bias_fairness, contractor_findings, and
      # document_evidence_injection against the pinned Vertex model —
      # exactly the gate the audit asked for. This wiring could not be
      # exercised end-to-end in the session that added it (no GCP project
      # available) — verify the real-Vertex path once secrets are set.
      - name: Evaluation gate (Gemini/Vertex — falls back to mock smoke without GCP secrets)
        working-directory: server
        env:
          AI_PROVIDER: gemini
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
          VERTEX_GEMINI_MODEL: ${{ secrets.VERTEX_GEMINI_MODEL }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/server/.gcp-sa-key.json
        run: |
          if [ -n "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" ]; then
            echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          fi
          npm run eval
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20.11', cache: 'npm', cache-dependency-path: dashboard/package-lock.json }
      - name: Install
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: dashboard
        run: npm run build --if-present
      # Blocking (unlike the server job's report-only step): dashboard's
      # production dependency tree currently has zero known high/critical
      # advisories, so this locks that in — a newly-introduced high/critical
      # vulnerability will correctly fail the build, not just get logged.
      - name: Dependency vulnerability scan
        working-directory: dashboard
        run: npm audit --omit=dev --audit-level=high
      # Automated WCAG 2.2 AA scan (axe-core) of the public marketing/legal
      # pages. Catches real color-contrast/semantic-markup regressions;
      # does NOT replace manual assistive-technology testing (screen reader
      # walkthroughs) — see TODO.md.
      - name: Install Playwright Chromium
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: Accessibility scan (axe-core)
        working-directory: dashboard
        run: npm run test:a11y
      # Authenticated-dashboard counterpart to the public scan above — needs
      # a real backend (SERVE_DASHBOARD=1), not the static preview server,
      # so it boots the actual Express app against a disposable SQLite DB.
      - uses: actions/setup-node@v4
        with: { node-version: '20.11', cache: 'npm', cache-dependency-path: server/package-lock.json }
      - name: Install server deps
        working-directory: server
        run: npm ci --no-audit --no-fund
      # playwright.authed.config.cjs's webServer migrates its own disposable
      # SQLite DB before starting the server — no separate step needed here.
      - name: Authenticated accessibility scan (axe-core + keyboard nav)
        working-directory: dashboard
        env:
          JWT_SECRET: ci-jwt-secret-must-be-at-least-32-characters-long-ok
        run: npm run test:a11y:authed
      # Authenticated nav-smoke e2e: registers a real (non-admin) user and
      # walks every nav destination that role can see, asserting no console
      # errors, no uncaught page errors, and no failed (5xx) responses. A
      # different failure signal than the WCAG scan above -- a crashed page
      # that renders nothing would trivially pass an axe scan (zero DOM,
      # zero violations) but fails here. Promoted from an ad hoc QA script
      # that caught three real regressions during the nav rewrite (two
      # 500s, an unmounted router, a route-ordering bug) -- see TODO.md.
      - name: Authenticated nav-smoke e2e
        working-directory: dashboard
        env:
          JWT_SECRET: ci-jwt-secret-must-be-at-least-32-characters-long-ok
        run: npm run test:e2e

