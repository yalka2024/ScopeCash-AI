name: ci

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scopecash-ai
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-must-be-at-least-32-characters-long-ok
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20.11', cache: 'npm', cache-dependency-path: server/package-lock.json }
      - name: Install
        working-directory: server
        run: npm ci --no-audit --no-fund
      # Validates the Postgres migration set applies cleanly against a real
      # Postgres on every PR — no `|| true`: a migration that fails here would
      # have failed identically in production. This previously pointed
      # DATABASE_URL at Postgres while `prisma generate`/`migrate deploy` ran
      # against the default SQLite schema — a provider mismatch that `|| true`
      # was silently swallowing rather than fixing.
      - name: Validate Postgres migrations apply cleanly
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scopecash-ai
        run: |
          node prisma/sync-postgres-schema.js
          npx prisma migrate deploy --config prisma.postgres.config.ts
      - name: Prisma generate (SQLite — used by the test suite)
        working-directory: server
        run: npx prisma generate
      - name: Prisma migrate (SQLite test DB)
        working-directory: server
        run: npx prisma migrate deploy
      - name: Tests
        working-directory: server
        run: npm test
      # Release eval gate. Always runs — without GCP secrets configured (e.g.
      # every fork PR; GitHub Actions never exposes repo secrets to those) it
      # falls back to the deterministic 4-case mock "smoke" suite, which only
      # validates the harness itself, not model behavior. With
      # GCP_SERVICE_ACCOUNT_KEY/GCP_PROJECT_ID/VERTEX_GEMINI_MODEL configured
      # as repo secrets (pushes to main, and PRs from branches within this
      # repo), it runs the real thing: toxicity, prompt_injection,
      # robustness, bias_fairness, contractor_findings, and
      # document_evidence_injection against the pinned Vertex model —
      # exactly the gate the audit asked for. This wiring could not be
      # exercised end-to-end in the session that added it (no GCP project
      # available) — verify the real-Vertex path once secrets are set.
      - name: Evaluation gate (Gemini/Vertex — falls back to mock smoke without GCP secrets)
        working-directory: server
        env:
          AI_PROVIDER: gemini
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
          VERTEX_GEMINI_MODEL: ${{ secrets.VERTEX_GEMINI_MODEL }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/server/.gcp-sa-key.json
        run: |
          if [ -n "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" ]; then
            echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          fi
          npm run eval
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20.11', cache: 'npm', cache-dependency-path: dashboard/package-lock.json }
      - name: Install
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: dashboard
        run: npm run build --if-present
      # Automated WCAG 2.2 AA scan (axe-core) of the public marketing/legal
      # pages. Catches real color-contrast/semantic-markup regressions;
      # does NOT replace manual assistive-technology testing (screen reader
      # walkthroughs) — see TODO.md.
      - name: Install Playwright Chromium
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: Accessibility scan (axe-core)
        working-directory: dashboard
        run: npm run test:a11y

