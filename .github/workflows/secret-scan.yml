name: secret-scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '23 5 * * *'   # daily 05:23 UTC

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # GITLEAKS_CONFIG points at .gitleaks.toml, which allowlists three
      # verified false positives that were failing every scheduled run: this
      # workflow file's own fake CI JWT_SECRET, and two `pk_live_...`
      # placeholders inside help.js's API documentation. Each was inspected
      # before being allowlisted — see that file's header.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
          GITLEAKS_ENABLE_SUMMARY: 'true'

