name: iac-scan

on:
  push:
    branches: [master]
    paths: ['deploy/**']
  pull_request:
    branches: [master]
    paths: ['deploy/**']
  schedule:
    - cron: '41 6 * * *'   # daily 06:41 UTC
  # Manually runnable: this workflow is otherwise only reachable by a change
  # under deploy/ or by waiting for the cron, which makes verifying a fix to
  # the workflow itself needlessly slow.
  workflow_dispatch:

jobs:
  trivy-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # Trivy's config scanner (tfsec's actively-maintained successor —
      # tfsec itself is in maintenance mode) covers both Terraform modules
      # and the Helm chart under deploy/ in one pass. The three Dockerfiles
      # live outside deploy/ (repo root, server/, dashboard/) and are
      # already covered by container-build-sign.yml's grype scan of the
      # built image, a more thorough check than static Dockerfile linting.
      #
      # NOT blocking yet (exit-code 0, continue-on-error): no Trivy CLI was
      # available in the session that added this to pre-check whether the
      # PRE-EXISTING AWS Terraform/Helm/Dockerfiles (not just the new GCP
      # module) already have HIGH/CRITICAL findings — making this blocking
      # blind could red the build on unreviewed existing infra rather than
      # on anything this change introduced. Findings still upload to the
      # Security tab either way. Review the first real run's findings, fix
      # what's real, then flip exit-code to '1' (see TODO.md).
      - name: Scan deploy/ for IaC misconfigurations
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: deploy
          format: sarif
          output: trivy-iac.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'
      # continue-on-error: this repo is PRIVATE without GitHub Advanced
      # Security, so this upload 403s and was failing the whole scheduled run
      # — the scan itself had succeeded every time. Kept (rather than
      # deleted) so it starts working the moment GHAS is enabled; the
      # artifact below is the readable copy until then.
      - name: Upload results to code scanning (403s without GHAS — see above)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-iac.sarif
      - name: Upload results as artifact (no GHAS — readable copy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-iac-sarif
          path: trivy-iac.sarif
          retention-days: 30

  # Syntax/schema validation, separate from the security scan above. This is
  # BLOCKING: until 2026-07-27 the GCP module had never been run through the
  # Terraform CLI and did not parse at all (two arguments on single-line
  # blocks, concat() in depends_on), so it could never have been applied. A
  # module that doesn't parse is a build error, not a finding to triage.
  terraform-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        module: [deploy/terraform-gcp, deploy/terraform]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: terraform fmt
        working-directory: ${{ matrix.module }}
        run: terraform fmt -check -diff -recursive
      # -backend=false: no remote state or credentials needed to check syntax
      # and provider schemas. `plan` would need real cloud credentials and is
      # deliberately NOT run here.
      - name: terraform init
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false -input=false
      - name: terraform validate
        working-directory: ${{ matrix.module }}
        run: terraform validate
