name: container-build-sign

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # required for cosign keyless

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/scopecash-ai-server
  DASH_IMAGE:   ghcr.io/${{ github.repository_owner }}/scopecash-ai-dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: server,    context: ./server,    image: SERVER_IMAGE }
          - { name: dashboard, context: ./dashboard, image: DASH_IMAGE }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image
        id: img
        run: echo "image=${{ env[matrix.image] }}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:${{ github.sha }}
            ${{ steps.img.outputs.image }}:latest
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.img.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json

      - name: Vulnerability scan (grype)
        uses: anchore/scan-action@v4
        with:
          image: ${{ steps.img.outputs.image }}@${{ steps.build.outputs.digest }}
          fail-build: false
          severity-cutoff: high

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env: { COSIGN_EXPERIMENTAL: "1" }
        run: cosign sign --yes ${{ steps.img.outputs.image }}@${{ steps.build.outputs.digest }}

      - name: Attach SBOM attestation
        env: { COSIGN_EXPERIMENTAL: "1" }
        run: |
          cosign attest --yes --predicate sbom-${{ matrix.name }}.spdx.json \
            --type spdxjson ${{ steps.img.outputs.image }}@${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json

